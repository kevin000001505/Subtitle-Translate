<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Subtitle Library</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

<header class="topbar">
    <div class="brand">Subtitle Library</div>
    <nav class="server-tabs hidden" id="server-tabs" aria-label="Media server"></nav>
    <input type="search" id="search" class="search" placeholder="Search titles…" aria-label="Search titles">
    <div class="kind-filter" id="kind-filter" role="group" aria-label="Show">
        <button class="chip active" data-kind="all">All</button>
        <button class="chip" data-kind="movie">Movies</button>
        <button class="chip" data-kind="show">Shows</button>
    </div>
</header>

<section class="toolbar" aria-label="Job options">
    <div class="op-tabs" id="op-tabs" role="tablist">
        <button class="op active" data-op="translate">Translate</button>
        <button class="op" data-op="shift">Shift timing</button>
        <button class="op" data-op="sync">Sync &amp; align</button>
    </div>

    <label class="field">
        <span>Language</span>
        <select id="lang"></select>
    </label>

    <label class="field op-translate">
        <span>Model</span>
        <select id="model"></select>
    </label>

    <label class="field check op-translate">
        <input type="checkbox" id="overwrite">
        <span>Overwrite existing</span>
    </label>

    <label class="field op-shift hidden">
        <span>Offset (ms)</span>
        <input type="number" id="offset" value="-500" step="100">
    </label>

    <label class="field op-sync hidden">
        <span>Align against</span>
        <select id="priority">
            <option value="auto">Auto</option>
            <option value="srt">English subtitle</option>
            <option value="audio">Audio</option>
        </select>
    </label>

    <div class="run">
        <span id="selection-count" class="muted">Nothing selected</span>
        <button id="clear-selection" class="link hidden">Clear</button>
        <button id="run" class="primary" disabled>Translate</button>
    </div>
</section>

<p id="model-note" class="note hidden"></p>

<main>
    <div id="library-state" class="state">Loading library…</div>
    <div id="grid" class="grid"></div>
</main>

<aside class="jobs" id="jobs-panel" aria-label="Jobs">
    <div class="jobs-head">
        <button id="jobs-toggle" class="jobs-title">Jobs <span id="jobs-badge" class="count hidden"></span></button>
        <button id="jobs-clear" class="link">Clear finished</button>
    </div>
    <ol id="jobs-list" class="jobs-list"></ol>
</aside>

<dialog id="show-dialog" class="show-dialog">
    <form method="dialog" class="show-head">
        <img id="show-poster" alt="">
        <div>
            <h2 id="show-title"></h2>
            <p id="show-summary" class="muted"></p>
            <label class="check"><input type="checkbox" id="show-all"> Whole show</label>
        </div>
        <button class="close" aria-label="Close">✕</button>
    </form>
    <div id="show-seasons" class="seasons"></div>
    <div class="show-foot">
        <button id="show-apply" class="primary">Done</button>
    </div>
</dialog>

<div id="toast" class="toast hidden" role="status"></div>

<script src="app.js"></script>
</body>
</html>
