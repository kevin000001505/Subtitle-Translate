services:
  backend:
    build: .
    # Every value comes from .env (see .env.example); the defaults match the code's.
    environment:
      # The media folder has its own timeout, below the frontend proxy's 60 s.
      - MEDIA_FOLDER_TIMEOUT_SECONDS=${MEDIA_FOLDER_TIMEOUT_SECONDS:-20}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-2.5-flash-lite}
      - TRANSLATOR_BACKEND=${TRANSLATOR_BACKEND:-translatemgemma}
      - TRANSLATE_GEMMA_URL=${TRANSLATE_GEMMA_URL:-http://localhost:8080}
      - TRANSLATE_GEMMA_MODEL=${TRANSLATE_GEMMA_MODEL:-translatemgemma}
      - TRANSLATE_GEMMA_API_KEY=${TRANSLATE_GEMMA_API_KEY:-random_key}
      - JELLYFIN_URL=${JELLYFIN_URL:-}
      - JELLYFIN_API_KEY=${JELLYFIN_API_KEY:-}
      - JELLYFIN_PATH_MAP=${JELLYFIN_PATH_MAP:-}
      - PLEX_URL=${PLEX_URL:-}
      - PLEX_TOKEN=${PLEX_TOKEN:-}
      - PLEX_PATH_MAP=${PLEX_PATH_MAP:-}
    volumes:
      - ${MEDIA}/media:/media
      - ./queue_data:/app/data
    command: uvicorn main:app --host 0.0.0.0 --port 8000
    restart: unless-stopped

  frontend:
    image: nginx:alpine
    ports:
      - "8081:80"
    volumes:
      - ./frontend/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./frontend:/usr/share/nginx/html:ro
      # nginx runs the check from a path outside the web root. Note: the
      # ./frontend web root mount above also exposes this file (and
      # nginx.conf) as static files under /check-webroot.sh and /nginx.conf.
      - ./frontend/check-webroot.sh:/usr/local/bin/check-webroot.sh:ro
    depends_on:
      - backend
    restart: unless-stopped
    # Fail loudly when the web root lost index.html (stale bind mount),
    # then start nginx in the foreground through the official entrypoint so
    # its standard configuration hooks still run. The check-then-start
    # program is one shell string passed to `sh -c`: compose v5+ drops
    # shell operators from scalar commands, so a scalar command would
    # silently never start nginx.
    command:
      - sh
      - -c
      - sh /usr/local/bin/check-webroot.sh && exec /docker-entrypoint.sh nginx -g 'daemon off;'
